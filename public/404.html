<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — Derovia</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f4f0">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet" referrerpolicy="no-referrer">
</head>
<body>
  <header class="nav-wrap" data-stuck="true">
    <div class="nav-sheet" aria-hidden="true"></div>
    <div class="container nav-inner">
      <a href="/" class="brand">
        <img class="brand-mark" src="/assets/favicon.svg" alt="" width="24" height="24">
        <span>Derovia</span>
      </a>
      <a class="btn btn--sm btn--beige" href="/">← Retour à l’accueil</a>
    </div>
  </header>

  <main class="not-found">
    <section class="not-found__card" aria-labelledby="not-found-title">
      <span class="not-found__code">Erreur 404</span>
      <h1 class="display-h2" id="not-found-title">Cette page n’existe pas.</h1>
      <p class="lead">
        Le lien a peut-être été déplacé ou supprimé. Vous pouvez revenir sur la page d’accueil ou nous contacter directement.
      </p>
      <div class="not-found__actions">
        <a class="btn btn--md btn--dark" href="/">Retour à l’accueil</a>
        <a class="btn btn--md btn--white" href="mailto:contact@derovia.fr">contact@derovia.fr</a>
      </div>
    </section>
  </main>
</body>
</html>
