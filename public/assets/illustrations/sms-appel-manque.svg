<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Schéma SMS automatique sur appel manqué Derovia : réponse en 8 secondes, qualification client et rendez-vous synchronisé">
  <defs>
    <pattern id="iso2" width="64" height="36.95" patternUnits="userSpaceOnUse">
      <path d="M0 18.475 L32 0 L64 18.475 L32 36.95 Z" fill="none" stroke="#2e2926" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="cs2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2e2926" flood-opacity="0.09"/>
    </filter>
    <filter id="core2" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1f1d1b" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="w2a" x1="300" y1="200" x2="480" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f1d1b" stop-opacity="0"/>
      <stop offset="30%" stop-color="#2d9d78" stop-opacity="0.55"/>
      <stop offset="85%" stop-color="#1f1d1b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#1f1d1b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w2b" x1="480" y1="200" x2="640" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f1d1b" stop-opacity="0"/>
      <stop offset="25%" stop-color="#1f1d1b" stop-opacity="0.22"/>
      <stop offset="75%" stop-color="#2d9d78" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#1f1d1b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="400" rx="18" fill="#f6f4f0"/>
  <rect width="960" height="400" rx="18" fill="url(#iso2)"/>

  <path d="M300 200 L480 200" stroke="url(#w2a)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M480 200 L640 200" stroke="url(#w2b)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Left Card: Appel manqué -->
  <g filter="url(#cs2)">
    <rect x="44" y="106" width="272" height="188" rx="20" fill="#fdfcf9" stroke="#1f1d1b" stroke-opacity="0.09"/>
  </g>
  <rect x="64" y="128" width="122" height="26" rx="13" fill="#fcece7"/>
  <circle cx="78" cy="141" r="4" fill="#e56b4e"/>
  <text x="88" y="145.5" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#9c341d">Appel manqué</text>
  <text x="262" y="145.5" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#5c5751">11h14</text>

  <text x="64" y="194" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1f1d1b">06 84 •• •• 12</text>
  <text x="64" y="218" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="13.5" fill="#5c5751">Atelier occupé · Non décroché</text>
  <rect x="64" y="242" width="232" height="32" rx="10" fill="#f2efe9"/>
  <text x="78" y="262.5" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#4f4b46">Filtre anti-démarchage · OK</text>

  <!-- Center: Naked Black Derovia Squircle -->
  <g filter="url(#core2)">
    <rect x="424" y="152" width="96" height="96" rx="24" fill="#1f1d1b"/>
  </g>
  <g transform="translate(446, 174) scale(1.625)">
    <path fill="#ffffff" d="M8.2 3H15.5C22.7 3 28.5 8.8 28.5 16C28.5 23.2 22.7 29 15.5 29H8.2C6.43 29 5 27.57 5 25.8V16C5 14.23 6.43 12.8 8.2 12.8H14.6C16.37 12.8 17.8 14.23 17.8 16C17.8 17.77 16.37 19.2 14.6 19.2H11.4V22.6H15.4C19.1 22.6 22 19.7 22 16C22 12.3 19.1 9.4 15.4 9.4H8.2C6.43 9.4 5 7.97 5 6.2C5 4.43 6.43 3 8.2 3Z"/>
  </g>

  <!-- Right Card: Conversation SMS & RDV -->
  <g filter="url(#cs2)">
    <rect x="608" y="54" width="308" height="292" rx="22" fill="#fdfcf9" stroke="#1f1d1b" stroke-opacity="0.09"/>
  </g>
  <text x="630" y="84" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1f1d1b">SMS automatique</text>
  <rect x="810" y="66" width="84" height="24" rx="12" fill="#e3f5ee"/>
  <text x="822" y="82" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#145c44">En 8 sec</text>

  <!-- Outgoing SMS bubble -->
  <rect x="630" y="106" width="248" height="62" rx="14" fill="#e7eeff"/>
  <text x="644" y="128" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#1d3da0">« Bonjour, je suis sous un pont.</text>
  <text x="644" y="147" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="12.5" fill="#1d3da0">Indiquez votre plaque et besoin ? »</text>

  <!-- Incoming client reply -->
  <rect x="658" y="182" width="236" height="58" rx="14" fill="#f2efe9"/>
  <text x="672" y="205" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#1f1d1b">« Clio V · Révision 60 000 km.</text>
  <text x="672" y="224" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="12.5" fill="#5c5751">Dispo jeudi matin si possible »</text>

  <!-- Confirmed slot pill -->
  <rect x="630" y="260" width="264" height="62" rx="14" fill="#e3f5ee"/>
  <text x="646" y="286" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#145c44">✓ Créneau jeudi 9h30 confirmé</text>
  <text x="646" y="306" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#145c44">Synchro Agenda + rappel veille</text>
</svg>
