<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Schéma classement automatique des factures fournisseurs et suivi comptable Derovia : extraction TVA, renommage et export Pennylane ou Sage">
  <defs>
    <pattern id="iso4" width="64" height="36.95" patternUnits="userSpaceOnUse">
      <path d="M0 18.475 L32 0 L64 18.475 L32 36.95 Z" fill="none" stroke="#2e2926" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="cs4" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2e2926" flood-opacity="0.09"/>
    </filter>
    <filter id="core4" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1f1d1b" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="w4" x1="300" y1="200" x2="660" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f1d1b" stop-opacity="0"/>
      <stop offset="25%" stop-color="#3663e0" stop-opacity="0.45"/>
      <stop offset="75%" stop-color="#2d9d78" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1f1d1b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="400" rx="18" fill="#f6f4f0"/>
  <rect width="960" height="400" rx="18" fill="url(#iso4)"/>

  <path d="M310 132 C385 132, 415 200, 480 200" stroke="url(#w4)" stroke-width="2" fill="none"/>
  <path d="M310 268 C385 268, 415 200, 480 200" stroke="url(#w4)" stroke-width="2" fill="none"/>
  <path d="M480 200 L640 200" stroke="url(#w4)" stroke-width="2" fill="none"/>

  <!-- Left 1: Facture par mail -->
  <g filter="url(#cs4)">
    <rect x="44" y="74" width="272" height="112" rx="18" fill="#fdfcf9" stroke="#1f1d1b" stroke-opacity="0.09"/>
  </g>
  <rect x="64" y="92" width="96" height="24" rx="12" fill="#e7eeff"/>
  <text x="76" y="108" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#1d3da0">Reçu par mail</text>
  <text x="64" y="142" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#1f1d1b">Facture Rexel #8412</text>
  <text x="64" y="164" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#5c5751">PDF pièce jointe · 482,40 €</text>

  <!-- Left 2: Photos & tickets WhatsApp -->
  <g filter="url(#cs4)">
    <rect x="44" y="214" width="272" height="112" rx="18" fill="#fdfcf9" stroke="#1f1d1b" stroke-opacity="0.09"/>
  </g>
  <rect x="64" y="232" width="118" height="24" rx="12" fill="#e3f5ee"/>
  <text x="76" y="248" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#145c44">Photo WhatsApp</text>
  <text x="64" y="282" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#1f1d1b">Ticket + 4 photos fin</text>
  <text x="64" y="304" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#5c5751">IMG_4829.jpg · Chantier Lyon</text>

  <!-- Center: Naked Black Derovia Squircle -->
  <g filter="url(#core4)">
    <rect x="432" y="152" width="96" height="96" rx="24" fill="#1f1d1b"/>
  </g>
  <g transform="translate(454, 174) scale(1.625)">
    <path fill="#ffffff" d="M8.2 3H15.5C22.7 3 28.5 8.8 28.5 16C28.5 23.2 22.7 29 15.5 29H8.2C6.43 29 5 27.57 5 25.8V16C5 14.23 6.43 12.8 8.2 12.8H14.6C16.37 12.8 17.8 14.23 17.8 16C17.8 17.77 16.37 19.2 14.6 19.2H11.4V22.6H15.4C19.1 22.6 22 19.7 22 16C22 12.3 19.1 9.4 15.4 9.4H8.2C6.43 9.4 5 7.97 5 6.2C5 4.43 6.43 3 8.2 3Z"/>
  </g>

  <!-- Right: Dossier Comptable Prêt -->
  <g filter="url(#cs4)">
    <rect x="616" y="72" width="300" height="256" rx="22" fill="#fdfcf9" stroke="#1f1d1b" stroke-opacity="0.09"/>
  </g>
  <rect x="638" y="94" width="128" height="24" rx="12" fill="#faf1dc"/>
  <text x="650" y="110" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#7c5310">Prêt pour bilan</text>
  <text x="638" y="148" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#1f1d1b">Dossier Novembre 2026</text>

  <rect x="638" y="168" width="256" height="44" rx="11" fill="#f2efe9"/>
  <text x="652" y="194" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#1f1d1b">2026-11-Rexel-482EUR.pdf</text>

  <rect x="638" y="222" width="256" height="38" rx="11" fill="#e7eeff"/>
  <text x="652" y="245" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#1d3da0">HT : 402,00 €  ·  TVA : 80,40 €</text>

  <rect x="638" y="270" width="256" height="38" rx="11" fill="#e3f5ee"/>
  <text x="652" y="293" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#145c44">✓ Transmis Pennylane / Sage / Drive</text>
</svg>
