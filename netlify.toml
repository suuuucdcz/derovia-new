"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "public"

# ============================================================================
# Security & Privacy Headers (A+ Hardening)
# ============================================================================

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://app.derovia.fr; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; media-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-Permitted-Cross-Domain-Policies = "none"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"

# Static brand assets & self-hosted fonts — long-lived immutable CDN cache
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/illustrations/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/assets/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/assets/favicon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/assets/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/assets/og-derovia.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"
    Cross-Origin-Resource-Policy = "cross-origin"

# Versioned CSS & JS (?v=YYYYMMDD) — 1-year immutable CDN cache
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Discovery header & Markdown endpoints for AI agents (llms.txt v2)
[[headers]]
  for = "/"
  [headers.values]
    Link = "</llms.txt>; rel=\"describedby\"; type=\"text/markdown\", </llms-full.txt>; rel=\"alternate\"; type=\"text/markdown\""

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# ============================================================================
# Clean URLs, Legacy Redirects & Custom 404
# ============================================================================

[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 200

